name: Build nadirOS

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils nasm mtools xorriso qemu-system-x86

      - name: Fetch Limine (prebuilt binaries) and build its installer
        run: |
          git clone --depth 1 --branch v11.x-binary https://github.com/Limine-Bootloader/Limine.git build/limine
          make -C build/limine

      - name: Build kernel
        run: make -C build

      - name: Boot test in QEMU
        run: make -C build test

      - name: Build bootable ISO (not yet verified locally)
        continue-on-error: true
        run: make -C build iso

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: nadiros-kernel
          path: build/nadiros.elf

      - name: Upload disk image
        uses: actions/upload-artifact@v4
        with:
          name: nadiros-disk
          path: build/nadiros.img
