name: Build nadirOS

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y             build-essential             binutils             nasm

      - name: Build kernel
        run: make -C build

      - name: Verify kernel
        run: file build/nadiros.elf

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: nadiros-kernel
          path: build/nadiros.elf
